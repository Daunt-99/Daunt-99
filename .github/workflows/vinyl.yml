name: Refresh contribution record
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw public contribution calendar
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/users/Daunt-99/contributions -o "$RUNNER_TEMP/calendar.html"
          python3 scripts/vinyl.py "$RUNNER_TEMP/calendar.html" vinyl.svg
      - name: Publish changed map
        run: |
          git add vinyl.svg
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh contribution record"
            git push
          fi
